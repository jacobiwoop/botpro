name: Build Botpro React Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'botpro/**'
      - '.github/workflows/build_react_native_apk.yml'

jobs:
  build:
    name: Build React Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install NPM Dependencies
        run: |
          cd botpro
          npm install

      - name: Expo Prebuild (Generate Native Android Project)
        run: |
          cd botpro
          npx expo prebuild --platform android --clean --no-install

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x botpro/android/gradlew

      - name: Ensure Release Signing Config
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' botpro/android/app/build.gradle || true

      - name: Assemble Release APK
        run: |
          cd botpro/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Botpro-React-Native-Release-APK
          path: botpro/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
